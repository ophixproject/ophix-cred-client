[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophix-cred-client"
version = "2026.04.12.01"
description = "Credential Tier 1 client for Ophix Project Servers"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [
    { name = "Ophix Project" }
]
dependencies = [
    "requests",
    "python-dotenv",
    "distro",
]

[project.scripts]
cred-client = "cred_client.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
