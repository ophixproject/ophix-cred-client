[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophix-cred-client"
version = "2026.05.18.01"
description = "Credential Tier 1 client for Ophix Project Servers"
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
authors = [
    { name = "Ophix Project" }
]
dependencies = [
    "ophix-client-core>=2026.05.12.01",
    "requests>=2.32.5",
    "python-dotenv>=1.2.1",
    "distro>=1.9.0",

]

[project.scripts]
cred-client = "cred_client.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
